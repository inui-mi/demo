<!DOCTYPE html>
<html lang="ja" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演習</title>
</head>
<body>
    計算したい数字を入れてください<br>
    <form action="result-plus-minus.html" th:action="@{/plus-minus/input}" method="post">
        <input type="text" id="num1" name="num1" required>

        <span id="operation-symbol">+</span>

        <input type="text" id="num2" name="num2" required>

        <span>=</span>

        <br>

        <input type="text" id="num3" name="num3" required>

        <span id="operation-symbol">−</span>

        <input type="text" id="num4" name="num4" required>

        <span>=</span>

        <br>

        <input type="text" id="num5" name="num5" required>

        <span id="operation-symbol">×</span>

        <input type="text" id="num6" name="num6" required>

        <span>=</span>

        <br>

        <input type="text" id="num7" name="num7" required>

        <span id="operation-symbol">÷</span>

        <input type="text" id="num8" name="num8" required>

        <span>=</span>

        <br>

        <button>送信</button>
    </form>
</body>
</html>
